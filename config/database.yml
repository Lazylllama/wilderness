# Dev/test run on PostgreSQL (see the `db` service in docker-compose.yml).
# Production keeps SQLite, stored in storage/ as a persistent Docker volume
# (see config/deploy.yml) -- these are two independent adapters below.
postgres: &postgres
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

sqlite: &sqlite
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *postgres
  database: wilderness_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *postgres
  database: wilderness_test

production:
  primary:
    <<: *sqlite
    database: storage/production.sqlite3
  cache:
    <<: *sqlite
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
