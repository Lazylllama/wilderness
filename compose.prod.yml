# Production deploy on a single Linux box:
#   cp .env.production.example .env   # fill it in
#   docker compose -f compose.prod.yml up -d --build
#
# Thruster terminates TLS on 443 (Let's Encrypt cert for $TLS_DOMAIN, cached in
# the storage volume) and proxies to Puma. Already have nginx/Caddy in front?
# Drop TLS_DOMAIN, map "127.0.0.1:3000:80" instead of 80/443, and proxy to that.
name: wilderness-prod

services:
  app:
    build: .
    restart: unless-stopped
    command: ["./bin/thrust", "./bin/rails", "server"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/wilderness_production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wilderness_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  storage:
  postgres_data:
