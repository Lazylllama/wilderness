# Production deploy on a single Linux box:
#   cp .env.production.example .env   # fill it in
#   docker compose -f compose.prod.yml up -d --build
#
# By default the app serves plain HTTP on $APP_PORT (default 3000) and something
# else terminates TLS in front of it -- on Hack Club Nest, point your subdomain
# at that port. Nothing in front? Set TLS_DOMAIN in .env and swap the ports
# mapping for "80:80" + "443:443"; Thruster then gets its own Let's Encrypt cert.
name: wilderness-prod

services:
  app:
    build: .
    restart: unless-stopped
    command: ["./bin/thrust", "./bin/rails", "server"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/wilderness_production
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wilderness_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  storage:
  postgres_data:
